<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor Máquinas</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#123c69,#1f6fb2)
    }

    .box{
      width:min(420px,100%);
      padding:28px;
      border-radius:14px;
      background:#fff;
      box-shadow:0 10px 35px #0004
    }

    h1{color:#123c69}

    label{
      display:block;
      margin-top:14px;
      color:#687585;
      font-size:14px
    }

    input{
      width:100%;
      padding:12px;
      margin-top:6px;
      border:1px solid #dce3eb;
      border-radius:7px;
      font-size:16px
    }

    button{
      width:100%;
      margin-top:18px;
      padding:12px;
      border:0;
      border-radius:7px;
      background:#1f6fb2;
      color:#fff;
      font-weight:bold;
      font-size:16px;
      cursor:pointer
    }

    button:disabled{opacity:.6}

    #message{
      min-height:24px;
      margin-top:15px;
      font-size:14px;
      white-space:pre-wrap
    }

    .success{color:#16845b}
    .error{color:#c0392b}

    #dashboard{
      display:none;
      margin-top:20px;
      padding:18px;
      border-radius:8px;
      background:#e8f5ee;
      color:#16845b
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>⚙️ Gestor Máquinas</h1>
    <p>Teste de ligação ao servidor.</p>

    <form id="loginForm">

      <label>
        Utilizador
        <input id="username" value="julio" required>
      </label>

      <label>
        Palavra-passe
        <input id="password" type="password" required>
      </label>

      <button id="loginButton" type="submit">
        Entrar
      </button>
    </form>

    <div id="message"></div>

    <div id="dashboard">
      <strong>Login realizado com sucesso.</strong>
      <p id="userInfo"></p>
      <p>A ligação entre o site e a API está funcionando.</p>
    </div>
  </div>

  <script>
    const API_URL =
      "https://gestor-maquinas-api.onrender.com";

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const dashboard =
      document.getElementById("dashboard");

    const userInfo =
      document.getElementById("userInfo");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.className = "";
      message.textContent = "A entrar...";
      button.disabled = true;

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      try {
        const response = await fetch(
          API_URL + "/login",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body:JSON.stringify({
              user:username,
              password:password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "O servidor rejeitou o login."
          );
        }

        localStorage.setItem(
          "gestorApiToken",
          data.token
        );

        message.className = "success";
        message.textContent = "Login aceite.";

        userInfo.textContent =
          "Utilizador: " +
          (data.name || username) +
          " | Perfil: " +
          (data.role || "Administrador");

        dashboard.style.display = "block";

      } catch (error) {
        message.className = "error";
        message.textContent =
          "Erro: " + error.message;
      }

      button.disabled = false;
    });
  </script>

</body>
</html>
